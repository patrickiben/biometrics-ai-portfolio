<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-labelledby="f1-t f1-d" class="chart"><title id="f1-t">F1. Rejection rate of the one-sided signed-area test against ke0</title><desc id="f1-d">Linear direct-effect model. Rejection rate rises from about 0.05 with no delay to about 0.99 at ke0 0.7 per hour for 32 participants; for a SAD cohort of 6 it stays below 0.45.</desc><style>.ax{stroke:#c3c2b7;stroke-width:1}.gr{stroke:#e1e0d9;stroke-width:1}.ref{stroke:#898781;stroke-width:1;stroke-dasharray:4 3}.tx{fill:#52514e;font:13px system-ui,-apple-system,'Segoe UI',sans-serif}.tt{fill:#0b0b0b;font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif}.bg{fill:#fcfcfb}.s1{stroke:#2a78d6}.s2{stroke:#eb6834}.f1{fill:#2a78d6}.f2{fill:#eb6834}.ring{stroke:#fcfcfb;stroke-width:2}.ind{stroke:#898781}.find{fill:#898781}@media (prefers-color-scheme:dark){.ax{stroke:#383835}.gr{stroke:#2c2c2a}.tx{fill:#c3c2b7}.tt{fill:#f0efec}.bg{fill:#1a1a19}.s1{stroke:#3987e5}.s2{stroke:#d95926}.f1{fill:#3987e5}.f2{fill:#d95926}.ring{stroke:#1a1a19}}</style><rect class="bg" width="480" height="310"/><line class="gr" x1="52.0" x2="410.0" y1="240.0" y2="240.0"/><text class="tx" x="46.0" y="240.0" text-anchor="end" dominant-baseline="middle">0.00</text><line class="gr" x1="52.0" x2="410.0" y1="184.0" y2="184.0"/><text class="tx" x="46.0" y="184.0" text-anchor="end" dominant-baseline="middle">0.25</text><line class="gr" x1="52.0" x2="410.0" y1="128.0" y2="128.0"/><text class="tx" x="46.0" y="128.0" text-anchor="end" dominant-baseline="middle">0.50</text><line class="gr" x1="52.0" x2="410.0" y1="72.0" y2="72.0"/><text class="tx" x="46.0" y="72.0" text-anchor="end" dominant-baseline="middle">0.75</text><line class="gr" x1="52.0" x2="410.0" y1="16.0" y2="16.0"/><text class="tx" x="46.0" y="16.0" text-anchor="end" dominant-baseline="middle">1.00</text><line class="ax" x1="52.0" x2="410.0" y1="240.0" y2="240.0"/><line class="ref" x1="52.0" x2="410.0" y1="228.8" y2="228.8"/><