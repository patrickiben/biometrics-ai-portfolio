><circle class="f2 ring" cx="111.1" cy="192.1" r="4.5"><title>n = 6 (exact), ke0 2: rejection rate 0.214 (MCSE 0.013)</title></circle><line class="s2" stroke-width="1.5" x1="170.2" x2="170.2" y1="155.8" y2="169.2"/><circle class="f2 ring" cx="170.2" cy="162.5" r="4.5"><title>n = 6 (exact), ke0 1: rejection rate 0.346 (MCSE 0.015)</title></circle><line class="s2" stroke-width="1.5" x1="220.8" x2="220.8" y1="140.9" y2="154.9"/><circle class="f2 ring" cx="220.8" cy="147.9" r="4.5"><title>n = 6 (exact), ke0 0.7: rejection rate 0.411 (MCSE 0.016)</title></circle><line class="s2" stroke-width="1.5" x1="288.3" x2="288.3" y1="133.7" y2="147.8"/><circle class="f2 ring" cx="288.3" cy="140.8" r="4.5"><title>n = 6 (exact), ke0 0.5: rejection rate 0.443 (MCSE 0.016)</title></circle><line class="s2" stroke-width="1.5" x1="389.6" x2="389.6" y1="133.1" y2="147.1"/><circle class="f2 ring" cx="389.6" cy="140.1" r="4.5"><title>n = 6 (exact), ke0 0.35: rejection rate 0.446 (MCSE 0.016)</title></circle><text class="tx" x="398.6" y="144.1" dominant-baseline="middle">n = 6 (exact)</text><text class="tx" transform="translate(13 128.0) rotate(-90)" text-anchor="middle">Rejection rate, one-sided</text></svg>
