# Build and publish the whole GitHub Pages site and its registered browser R apps.
# TRIALMON, UAT, lifecycle and vaccine analyses share Shinylive/webR assets.
# Bundled data are synthetic; vaccine uploads live only in a visitor's browser memory.
#
# Publishing needs the repository's Pages source set to "GitHub Actions" (Settings > Pages). Until
# then the build job still runs and checks everything, the deploy job is skipped with a notice, and
# the branch build keeps serving the site as before.
#
# Before anything is deployed, a smoke test opens every app's launch page in headless Chrome and
# fails the job unless each app starts, fills the outputs listed in apps/<name>/launch.json and
# shows no error (.github/pages/smoke/smoke.mjs).
#
# Action majors checked against their GitHub releases on 2026-10-25: actions/checkout v7,
# actions/setup-python v7, r-lib/actions v2, actions/setup-node v7, browser-actions/setup-chrome v2,
# actions/upload-artifact v7, actions/configure-pages v6, actions/upload-pages-artifact v5,
# actions/deploy-pages v5.
name: Pages (static site and Shinylive apps)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read          # to read the Pages source below
    outputs:
      pages_source: ${{ steps.source.outputs.build_type }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pdftotext (the package check reads the text of published PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Package check on the source pages
        # Runs before the build: the Shinylive output (webR assets, app.json bundles) is not
        # part of the package the check describes.
        run: python package_qc.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Install shinylive (pinned) and the apps' packages
        shell: Rscript {0}
        run: |
          install.packages("pak")
          pak::pkg_install(c("shinylive@0.5.0", "shiny", "bslib", "DT", "ggplot2", "testthat"))
      - name: App tests
        run: |
          Rscript uat_irt/tests/test-logic.R
          Rscript uat_irt/tests/test-server.R
          Rscript lifecycle_dashboard/tests/test-logic.R
          Rscript lifecycle_dashboard/tests/test-server.R
          Rscript sasr_monitoring_wiki/trialmon_tests/run-tests.R
          Rscript vaccine/tests/test_browser_core.R
          Rscript vaccine/tests/test_shiny.R
          Rscript tests/test_analysis_renderer_dependencies.R
      - name: Build the site (static pages, then shinylive::export for each app)
        # Copies the tracked files into _site/, exports each app listed by apps/<name>/launch.json
        # into _site/apps/<name>/ with shinylive 0.5.0 (assets 0.10.12), with the shared R helper
        # next to app.R and the launch page (apps/_shared/launch_template/) as its page, and stops
        # if any app, the shared assets, the helper or a launch page field is missing.
        run: Rscript .github/pages/build_site.R _site
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Install the smoke test's browser driver (puppeteer-core, pinned by its package-lock.json)
        run: npm ci --prefix .github/pages/smoke --no-audit --no-fund
      - name: Smoke test every app in headless Chrome (nothing is deployed unless every app passes)
        # Serves _site under /biometrics-ai-portfolio/ as Pages does and opens each launch page with
        # a fresh browser profile. Fails unless the page text shows at once, the app reaches ready,
        # the outputs listed in apps/<name>/launch.json have content (and the expected values), no
        # panel shows an error, each listed tab fills in, and a reload reaches ready again.
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          node .github/pages/smoke/smoke.mjs _site
          --shots "${RUNNER_TEMP}/smoke" --report "${RUNNER_TEMP}/smoke/report.json"
      - name: Install vaccine browser QC driver
        run: npm ci --prefix tools/browser-qc --no-audit --no-fund
      - name: Verify uploaded vaccine analyses and exports in the actual browser runtime
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          QA_OUTPUT_DIR: ${{ runner.temp }}/vaccine-webassembly-qc
        run: node vaccine/tests/browser_app_qc.cjs _site
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vaccine-webassembly-qc
          path: ${{ runner.temp }}/vaccine-webassembly-qc
          retention-days: 14
      - name: Keep the smoke test's screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14
      - name: Read the Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          if [ "${build_type}" != "workflow" ]; then
            echo "::notice title=Not deployed::The Pages source is '${build_type}', not GitHub Actions. The site was built and checked; switch Settings > Pages > Source to GitHub Actions to publish it from this workflow."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages_source == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
