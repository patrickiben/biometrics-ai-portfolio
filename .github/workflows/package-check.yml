name: Portfolio package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pdftotext (the check reads the text of published PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Check packaged files, navigation, links and documented counts
        run: python package_qc.py
