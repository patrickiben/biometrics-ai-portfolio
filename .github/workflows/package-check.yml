name: Portfolio package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  toolkit-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
      - name: Install R dependency for independent guided-preview verification
        run: Rscript -e 'if (!requireNamespace("jsonlite", quietly=TRUE)) install.packages("jsonlite", repos="https://cloud.r-project.org"); stopifnot(requireNamespace("jsonlite", quietly=TRUE))'
      - name: Check private-project source inventory
        run: python toolkit_launcher/source_inventory.py --check
      - name: Check local API, private files, job lifecycle and native R adapters
        run: python -m unittest discover -s toolkit_launcher/tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/browser-qc/package-lock.json
      - name: Install browser checks
        run: npm ci --prefix tools/browser-qc
      - name: Install Chromium with Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/browser-qc/node_modules/.bin/playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: tools/browser-qc/node_modules/.bin/playwright install chromium
      - name: Exercise toolkit browser forms
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          TOOLKIT_PYTHON: python
          QA_OUTPUT_DIR: ${{ runner.temp }}/toolkit-browser-qc
        run: node toolkit_launcher/tests/browser_qc.cjs
      - name: Exercise the real local R workflow
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          TOOLKIT_PYTHON: python
          QA_OUTPUT_DIR: ${{ runner.temp }}/toolkit-browser-qc
        run: node toolkit_launcher/tests/real_browser_qc.cjs
      - name: Exercise guided template setup and reusable profiles
        env:
          TOOLKIT_QA_RUN_ANALYSIS: "1"
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          TOOLKIT_PYTHON: python
          QA_OUTPUT_DIR: ${{ runner.temp }}/toolkit-browser-qc
        # CI-only access to its installed jsonlite; production projects keep
        # their explicitly managed private R library.
        run: node -e "process.env.R_LIBS_SITE=[process.env.R_LIBS_USER,process.env.R_LIBS_SITE].filter(Boolean).join(require('node:path').delimiter); require('./toolkit_launcher/tests/guided_browser_qc.cjs')"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toolkit-desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/toolkit-browser-qc
          retention-days: 7
  tracker-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install shared tracker components
        run: python -m pip install -r open_tracker/requirements-shared.txt
      - name: Check native workspace locks and desktop loading server
        run: python -m unittest discover -s open_tracker/tests -p test_desktop.py -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/browser-qc/package-lock.json
      - name: Install development-only browser checks
        run: |
          npm ci --prefix tools/browser-qc
          tools/browser-qc/node_modules/.bin/playwright install chromium
      - name: Exercise browser setup and administration on Windows
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          QA_OUTPUT_DIR: ${{ runner.temp }}/tracker-windows-qc
          TRACKER_PYTHON: python
        run: node open_tracker/tests/admin_browser_qc.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tracker-windows-qc
          path: ${{ runner.temp }}/tracker-windows-qc
          retention-days: 7
  tracker-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exercise guided setup, HTTPS, persistence, previews and backups in Compose
        env:
          QA_OUTPUT_DIR: ${{ runner.temp }}/tracker-container-qc
        run: python open_tracker/tests/container_smoke.py
      - name: Exercise browser-first setup and administration in Compose
        env:
          QA_OUTPUT_DIR: ${{ runner.temp }}/tracker-container-browser-qc
          TRACKER_CONTAINER_BROWSER: '1'
        run: python open_tracker/tests/container_smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tracker-container-qc
          path: |
            ${{ runner.temp }}/tracker-container-qc
            ${{ runner.temp }}/tracker-container-browser-qc
          retention-days: 7
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pdftotext (the check reads the text of published PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Check packaged files, navigation, links and documented counts
        run: python package_qc.py
      - name: Check that generated pages, partials, readouts and tokens match their sources
        run: |
          python build_pages.py --check
          python toolkit_launcher/source_inventory.py --check
      - name: Unit tests for the G2 per-program geometric-statistics check
        run: python validation_harness/checks/tests/test_g2_geo.py -v
      - name: Install optional Open Study Tracker shared-server dependencies
        run: python -m pip install -r open_tracker/requirements-shared.txt
      - name: Open Study Tracker shared accounts, notifications and storage tests
        run: python -m unittest discover -s open_tracker/tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/browser-qc/package-lock.json
      - name: Install development-only browser checks
        run: |
          npm ci --prefix tools/browser-qc
          tools/browser-qc/node_modules/.bin/playwright install --with-deps chromium
      - name: Check theme generation regressions
        run: python -m unittest discover -s tools/tests -v
      - name: Exercise every page in both themes and test portable tools
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          QA_OUTPUT_DIR: ${{ runner.temp }}/portfolio-browser-qc
        run: node .github/pages/smoke/site_qc.cjs
      - name: Exercise tracker offline and shared browser workflows
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          QA_OUTPUT_DIR: ${{ runner.temp }}/tracker-browser-qc
        run: node open_tracker/tests/browser_qc.cjs
      - name: Exercise point-and-click setup, people, email and workspace settings
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          QA_OUTPUT_DIR: ${{ runner.temp }}/tracker-admin-browser-qc
        run: node open_tracker/tests/admin_browser_qc.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toolkit-browser-qc
          retention-days: 7
          path: |
            ${{ runner.temp }}/portfolio-browser-qc
            ${{ runner.temp }}/tracker-browser-qc
            ${{ runner.temp }}/tracker-admin-browser-qc
  r-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Install app and test dependencies
        # fs 2.1 needs libuv; use its bundled copy when compiling source packages.
        # Fail here if an installation warning left any required namespace missing.
        env:
          USE_BUNDLED_LIBUV: '1'
        run: |
          Rscript -e 'packages <- c("shiny", "bslib", "DT", "ggplot2", "testthat"); install.packages(packages, repos="https://cloud.r-project.org"); missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly=TRUE)]; if(length(missing)) stop("Required packages failed to install: ", paste(missing, collapse=", "))'
      - name: Launcher, publication-filter and theme-generation regression checks
        run: python3 -m unittest discover -s tools/tests -v
      - name: Recompute guided AE and PK previews with the original R extractors
        run: python3 -m unittest toolkit_launcher.tests.test_guided_modules -v
      - name: Logic and Shiny server regression checks
        run: |
          Rscript sasr_monitoring_wiki/trialmon_tests/run-tests.R
          Rscript lifecycle_dashboard/tests/test-logic.R
          Rscript lifecycle_dashboard/tests/test-server.R
          Rscript risk_monitor/tests/test-logic.R
          Rscript risk_monitor/tests/test-server.R
          Rscript uat_irt/tests/test-logic.R
          Rscript uat_irt/tests/test-server.R
          Rscript budget_reconciliation/tests/test-logic.R
          Rscript budget_reconciliation/tests/test-server.R
          Rscript cqtc_hysteresis/tests/test_area.R
          Rscript sim_lifecycle/carryover_oc/tests/test_carryover.R
          cd tlf_interpret
          Rscript selftest.R
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser checks for native Shiny apps
        run: |
          npm ci --prefix tools/browser-qc
          tools/browser-qc/node_modules/.bin/playwright install --with-deps chromium
      - name: Launch every local R app from a private toolkit project
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          QA_OUTPUT_DIR: ${{ runner.temp }}/toolkit-shiny-qc
        # CI installed these packages in its user library above. Copy that one
        # library into the test project; production runtime isolation stays intact.
        run: TOOLKIT_QC_R_LIBRARY="$R_LIBS_USER" node toolkit_launcher/tests/shiny_browser_qc.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toolkit-shiny-qc
          path: ${{ runner.temp }}/toolkit-shiny-qc
          retention-days: 7
  runnable-analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      USE_BUNDLED_LIBUV: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::dplyr
            any::tidyr
            any::stringr
            any::purrr
            any::tibble
            any::rtables
            any::ggplot2
            any::ggrepel
            any::patchwork
            any::emmeans
            any::lme4
            any::lmerTest
            any::pbkrtest
            any::nlme
            any::broom
            any::broom.mixed
          dependencies: '"hard"'
      # Single-command steps preserve each exit code under Windows PowerShell.
      - name: Check all core source programs and edge cases
        run: Rscript toolkit_launcher/tests/test_analysis_core.R
      - name: Check independent model methods and adversarial cases
        run: Rscript tests/test_analysis_models.R
      - name: Check monitoring boundaries and malformed inputs
        run: Rscript tests/test_analysis_monitor.R
      - name: Check complete rendering and failure handling
        run: Rscript tests/test_analysis_renderer.R
      - name: Check vaccine numerical methods and missing-data boundaries
        run: Rscript vaccine/tests/test_analysis.R
      - name: Check independently authored vaccine scientific invariants
        run: Rscript vaccine/tests/test_scientific_invariants.R
      - name: Execute vaccine packages and adversarial revisions
        run: python -m unittest discover -s tests -p "test_vaccine_generated.py" -v
      - name: Check every input contract and all generated R-backed analyses
        env:
          ANALYSIS_CONTRACT_REPORT: ${{ runner.temp }}/analysis-contracts.json
          ANALYSIS_GENERATED_REPORT: ${{ runner.temp }}/analysis-generated.json
        run: python -m unittest discover -s tests -p "test_analysis_*.py" -v
      - name: Check guided provider and immutable analysis lifecycle
        run: python -m unittest toolkit_launcher.tests.test_guided_tlf toolkit_launcher.tests.test_guided_vaccine toolkit_launcher.tests.test_analysis_jobs -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/browser-qc/package-lock.json
      - name: Install guided analysis browser checks
        run: npm ci --prefix tools/browser-qc
      - name: Install Chromium with Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/browser-qc/node_modules/.bin/playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: tools/browser-qc/node_modules/.bin/playwright install chromium
      - name: Execute R and SAS-entry analyses through the browser forms
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          TOOLKIT_PYTHON: python
          TOOLKIT_QA_RUN_ANALYSIS: '1'
          TOOLKIT_QA_RUN_TLF: '1'
          QA_OUTPUT_DIR: ${{ runner.temp }}/analysis-browser-qc
        # Test-only access to the packages installed above. Production projects
        # continue to use their own isolated, explicitly installed runtime.
        run: node -e "process.env.R_LIBS_SITE=[process.env.R_LIBS_USER,process.env.R_LIBS_SITE].filter(Boolean).join(require('node:path').delimiter); require('./toolkit_launcher/tests/guided_browser_qc.cjs')"
      - name: Execute vaccine setup and analyses through browser controls
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          TOOLKIT_PYTHON: python
          QA_OUTPUT_DIR: ${{ runner.temp }}/vaccine-browser-qc
        run: node -e "process.env.R_LIBS_SITE=[process.env.R_LIBS_USER,process.env.R_LIBS_SITE].filter(Boolean).join(require('node:path').delimiter); require('./toolkit_launcher/tests/vaccine_browser_qc.cjs')"
      - name: Check vaccine guide and scientific learning interactions
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser-qc/node_modules
          TOOLKIT_PYTHON: python
          QA_OUTPUT_DIR: ${{ runner.temp }}/vaccine-browser-qc
        run: node vaccine/tests/content_browser_qc.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runnable-analysis-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/analysis-contracts.json
            ${{ runner.temp }}/analysis-generated.json
            ${{ runner.temp }}/analysis-browser-qc
            ${{ runner.temp }}/vaccine-browser-qc
          retention-days: 7
