<meta name="robots" content="noindex">
<title>Page not found | Patrick Iben</title>
<script>
/* GitHub Pages serves this page for a missing URL at any depth. When that URL sits inside the
   project path, point relative links (the stylesheet and the buttons below) at the site root. */
(function () {
  var m = location.pathname.match(/^\/biometrics-ai-portfolio\//);
  if (!m && /\.github\.io$/.test(location.hostname)) {
    m = location.pathname.match(/^\/[^\/]+\//);
  }
  if (m) {
    var b = document.createElement("base");
    b.href = m[0];
    document.head.appendChild(b);
  }
  document.write('<link rel="stylesheet" href="site.css">');
})();
</script>
